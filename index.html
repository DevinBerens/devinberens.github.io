<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Devin's Apps" />
    <title>Devin's Apps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0e0c09;
        --surface: #181410;
        --border: rgba(255, 255, 255, 0.07);
        --text: #f4efe8;
        --muted: #8a7d6b;
        --recipe: #ff8a4c;
        --hockey: #4cc3ff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px
          calc(env(safe-area-inset-bottom, 0px) + 24px);
      }
      main { width: 100%; max-width: 480px; margin: 0 auto; }
      h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
      p.sub { color: var(--muted); margin-bottom: 28px; }
      nav { display: grid; gap: 14px; }
      a.app {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 22px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--c);
        border-radius: 16px;
        color: var(--text);
        text-decoration: none;
        transition: transform 0.1s, border-color 0.15s;
      }
      a.app:hover, a.app:focus-visible { border-color: var(--c); outline: none; }
      a.app:active { transform: scale(0.98); }
      .icon { font-size: 34px; line-height: 1; }
      .name { font-size: 19px; font-weight: 600; }
      .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
      .arrow { margin-left: auto; color: var(--c); font-size: 22px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Devin's Apps</h1>
      <p class="sub">Pick an app.</p>
      <nav>
        <a class="app" href="recipes/" style="--c: var(--recipe)">
          <span class="icon" aria-hidden="true">🍳</span>
          <span><span class="name">Recipe Box</span><span class="desc" style="display:block">Shared family recipes</span></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="app" href="hockey/" style="--c: var(--hockey)">
          <span class="icon" aria-hidden="true">🏒</span>
          <span><span class="name">Hockey Dashboard</span><span class="desc" style="display:block">Garmin session stats</span></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </nav>
    </main>
  </body>
</html>
